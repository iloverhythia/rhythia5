<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rhythia Web</title>
<style>
:root{--bg:#000;--fg:#e8e8ea;--dim:#8a8a93;--line:#26262c;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
:root{padding:0!important}
#rl{position:fixed;inset:0;width:100vw;height:100vh;display:block;outline:none;touch-action:none}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:3;font:500 14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
#boot .box{width:min(420px,100%);display:grid;gap:14px}
#boot h1{margin:0;font-size:28px;letter-spacing:.02em;font-weight:700}
#boot .track{height:3px;background:var(--line);overflow:hidden}
#bar{height:100%;width:0;background:var(--fg);transition:width .2s}
#status{color:var(--dim);font-variant-numeric:tabular-nums}
#start{justify-self:start;background:var(--fg);color:var(--bg);border:0;padding:12px 28px;font:700 14px system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
#start:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
#boot p{margin:0;color:var(--dim);font-size:12px;max-width:52ch}
#dropmask{position:fixed;inset:0;z-index:4;display:grid;place-items:center;background:rgba(0,0,0,.7);border:2px dashed var(--fg);font:600 18px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
[hidden]{display:none!important}
</style>
<canvas id="rl" tabindex="0"></canvas>
<div id="boot">
  <div class="box">
    <h1>Rhythia</h1>
    <div class="track"><div id="bar"></div></div>
    <div id="status">Starting…</div>
    <button id="start" hidden>Click to play</button>
    <p>Web build of the open-source Rhythia client (CC BY-NC 4.0). Online maps, Discord login, profiles and leaderboards connect to Rhythia's servers. You can also drop .sspm files onto the window. Multiplayer lobbies need the Steam client.</p>
  </div>
</div>
<div id="dropmask" hidden>Drop .sspm maps to import</div>
<script type="module" src="boot.js"></script>
